spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/pawhub
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:pawhub}
    password: ${DB_PASSWORD:pawhub}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false
